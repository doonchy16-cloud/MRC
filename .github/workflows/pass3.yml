name: PASS 3 Elite UI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: PASS 3 + PASS 1 + PASS 2
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify PASS 3 UI
        shell: pwsh
        run: ./scripts/verify-pass3.ps1

      - name: Verify PASS 1 regressions
        shell: pwsh
        run: ./scripts/verify-pass1.ps1

      - name: Verify PASS 2 engine
        shell: pwsh
        run: ./scripts/verify-pass2.ps1
