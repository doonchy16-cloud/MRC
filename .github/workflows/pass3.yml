name: PASS 3 Elite UI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: PASS 3 + PASS 1 + PASS 2
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify PASS 3 UI
        shell: pwsh
        run: ./scripts/verify-pass3.ps1

      - name: Render PASS 3 preview
        shell: pwsh
        run: ./scripts/render-pass3-preview.ps1

      - name: Upload PASS 3 preview
        uses: actions/upload-artifact@v4
        with:
          name: MRC-PASS3-visual-preview
          path: artifacts/pass3/MRC-PASS3-*.png
          if-no-files-found: error
          retention-days: 7

      - name: Verify PASS 1 regressions
        shell: pwsh
        run: ./scripts/verify-pass1.ps1

      - name: Verify PASS 2 engine
        shell: pwsh
        run: ./scripts/verify-pass2.ps1
