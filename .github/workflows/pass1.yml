name: PASS 1 Foundation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, test, package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run PASS 1 test harness
        shell: pwsh
        run: dotnet run --project tests/MRC.Tests/MRC.Tests.csproj -c Release

      - name: Upload candidate package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MRC-v0.1.0-win-x64-candidate
          path: |
            artifacts/MRC-v0.1.0-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
