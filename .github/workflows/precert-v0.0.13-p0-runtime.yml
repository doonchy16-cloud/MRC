name: MRC v0.0.13 P0 Runtime Gate

on:
  push:
    branches: [ precert-v0.0.13 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-runtime:
    name: P0 Global Control Runtime
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run PASS2 runtime/control harness
        shell: pwsh
        run: ./scripts/verify-pass2.ps1
