name: Promote v0.0.11 for MRC updater

on:
  push:
    branches:
      - precert-v0.0.11
    paths:
      - '.release/v0.0.11-updater-visible'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Make v0.0.11 visible to releases/latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.0.11 \
            --repo doonchy16-cloud/MRC \
            --prerelease=false \
            --title "MRC v0.0.11 — Runtime Diagnostic Build" \
            --notes "Pre-certification diagnostic build for real Main-PC testing. Adds actionable runner-process inspection errors and enables ERROR DETAILS. This build is intentionally visible to MRC -update; it is not the final v0.1.0 certification release."
