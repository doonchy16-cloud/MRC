name: Pre-certification v0.0.9 Release

on:
  push:
    branches: [main]
    paths:
      - '.release/v0.0.9.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-package-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Re-verify PASS 4 through PASS 1
        shell: pwsh
        run: |
          ./scripts/verify-pass4.ps1
          ./scripts/verify-pass3.ps1
          ./scripts/verify-pass2.ps1
          ./scripts/verify-pass1.ps1

      - name: Build v0.0.9 installable package
        shell: pwsh
        run: |
          if (Test-Path artifacts) { Remove-Item artifacts -Recurse -Force }
          ./scripts/package.ps1 -Configuration Release -Runtime win-x64 -VersionOverride '0.0.9'

      - name: Verify v0.0.9 package identity and hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD 'artifacts\MRC-v0.0.9-win-x64.zip'
          $sums = Join-Path $PWD 'artifacts\SHA256SUMS.txt'
          if (-not (Test-Path $zip -PathType Leaf)) { throw "Missing $zip" }
          if (-not (Test-Path $sums -PathType Leaf)) { throw "Missing $sums" }

          $expected = ((Get-Content $sums -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "SHA-256 mismatch: expected $expected actual $actual" }

          $expanded = Join-Path $env:RUNNER_TEMP 'mrc-v0.0.9'
          if (Test-Path $expanded) { Remove-Item $expanded -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded

          $manifest = Get-Content (Join-Path $expanded 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne '0.0.9') { throw "Manifest version is $($manifest.version), expected 0.0.9" }
          if ($manifest.targetMachine -ne 'Main-PC') { throw 'Manifest target machine changed.' }
          if ($manifest.runnerRoot -ne 'D:\Git_Runners_Main') { throw 'Manifest runner root changed.' }

          $versionOutput = & (Join-Path $expanded 'payload\MRC.exe') --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Packaged MRC --version failed: $versionOutput" }
          if ($versionOutput -notmatch 'Version:\s*0\.0\.9') { throw "Packaged executable does not report 0.0.9: $versionOutput" }

          [xml]$props = Get-Content (Join-Path $PWD 'Directory.Build.props') -Raw
          if ([string]$props.Project.PropertyGroup.Version -ne '0.1.0') { throw 'Final source authority must remain 0.1.0.' }

          Write-Host "Verified release ZIP SHA256: $actual"
          Write-Host 'Verified manifest and executable version: 0.0.9'

      - name: Create v0.0.9 GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v0.0.9 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release v0.0.9 already exists; refusing to overwrite it.' }

          @'
          # MRC v0.0.9 — Main-PC Certification Build

          This is the installable pre-certification build for real Main-PC verification.

          - PASS 1–4 implementation is complete.
          - This build is **not** the final v0.1.0 certification release.
          - Install and use this build to execute the real PASS 5 verification matrix.
          - Target machine: Main-PC
          - Authorized runner root: D:\Git_Runners_Main

          Do not treat this prerelease as final product certification.
          '@ | Set-Content release-notes.md -Encoding utf8

          gh release create v0.0.9 `
            'artifacts\MRC-v0.0.9-win-x64.zip#MRC v0.0.9 Windows x64 installer package' `
            'artifacts\SHA256SUMS.txt#SHA-256 checksum authority' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'MRC v0.0.9 — Main-PC Certification Build' `
            --notes-file release-notes.md `
            --prerelease
