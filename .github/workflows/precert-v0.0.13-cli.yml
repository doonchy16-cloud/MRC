name: MRC v0.0.13 Segmented CLI Pre-Cert

on:
  push:
    branches: [ precert-v0.0.13 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-segments:
    name: Segmented CLI + Full Regression Gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run redesign acceptance harness
        shell: pwsh
        run: ./scripts/verify-redesign.ps1

      - name: Run PASS4 operations and updater regression
        shell: pwsh
        run: ./scripts/verify-pass4.ps1

      - name: Run PASS3 presentation regression
        shell: pwsh
        run: ./scripts/verify-pass3.ps1

      - name: Run PASS2 runtime regression
        shell: pwsh
        run: ./scripts/verify-pass2.ps1

      - name: Run PASS1 foundation and distribution regression
        shell: pwsh
        run: ./scripts/verify-pass1.ps1

      - name: Render v0.0.13 GUI previews
        shell: pwsh
        run: ./scripts/render-v0.0.13-preview.ps1

      - name: Upload v0.0.13 GUI evidence
        uses: actions/upload-artifact@v6
        with:
          name: MRC-v0.0.13-gui-previews
          path: artifacts/v0.0.13
          if-no-files-found: error
