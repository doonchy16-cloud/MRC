name: PASS 2 Runner Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: PASS 1 regression + PASS 2 engine
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify PASS 1 regression suite
        shell: pwsh
        run: ./scripts/verify-pass1.ps1

      - name: Verify PASS 2 engine suite
        shell: pwsh
        run: ./scripts/verify-pass2.ps1
