name: PASS 2 Runner Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: PASS 1 regression + PASS 2 engine
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify PASS 1 regression suite
        shell: pwsh
        run: ./scripts/verify-pass1.ps1

      - name: Verify PASS 2 engine suite
        shell: pwsh
        run: ./scripts/verify-pass2.ps1
