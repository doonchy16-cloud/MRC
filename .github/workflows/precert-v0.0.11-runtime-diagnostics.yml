name: Pre-cert v0.0.11 Runtime Diagnostics

on:
  push:
    branches: [ precert-v0.0.11 ]
    paths:
      - src/MRC.Core/Runtime/RunnerProcessAssociation.cs
      - src/MRC.Core/Properties/AssemblyInfo.cs
      - src/MRC.Gui/MainWindow.xaml
      - src/MRC.Gui/MainWindow.xaml.cs
      - tests/MRC.PreCert.Tests/**
      - .github/workflows/precert-v0.0.11-runtime-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify runtime diagnostics only
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run targeted pre-cert tests only
        shell: pwsh
        run: dotnet run --project tests/MRC.PreCert.Tests/MRC.PreCert.Tests.csproj -c Release
